spring:
  application:
    name: cics-genapp-backend
  datasource:
    # PostgreSQL connection is configured via TestcontainersConfiguration class
    # which uses DynamicPropertySource to inject datasource properties dynamically
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    # Use PostgreSQL dialect - actual datasource URL/driver set by Testcontainers
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  test:
    mockmvc:
      print: true

logging:
  level:
    root: INFO
    com.example.cicsgenapp: DEBUG
    org.springframework.test.context.cache: DEBUG
    org.testcontainers: INFO
    org.testcontainers.dockerclient: WARN
