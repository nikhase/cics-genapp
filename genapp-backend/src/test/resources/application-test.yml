spring:
  application:
    name: cics-genapp-backend
  datasource:
    url: jdbc:h2:mem:test
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
  test:
    mockmvc:
      print: true

logging:
  level:
    root: INFO
    com.example.cicsgenapp: DEBUG
