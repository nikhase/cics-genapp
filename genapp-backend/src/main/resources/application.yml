spring:
  application:
    name: cics-genapp-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 20
          fetch_size: 50
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      connection-test-query: "SELECT 1"
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  servlet:
    context-path: /
    session:
      timeout: 30m # Session timeout for Vaadin form-based authentication
  compression:
    enabled: true
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# Gateway Configuration
gateway:
  legacy-endpoint: http://localhost:8081
  service-endpoint: http://localhost:8080
  timeout: 5000

# CORS Configuration
cors:
  allowed-origins: http://localhost:3000,http://localhost:3001
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: Content-Type,Authorization,X-Trace-Id,X-Requested-With
  exposed-headers: X-Trace-Id
  max-age: 3600
  allow-credentials: true

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      legacy-cobol-system:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 1
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30000
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 5000
        recordExceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.HttpServerErrorException

logging:
  level:
    root: INFO
    com.example.cicsgenapp: DEBUG

---

# Development profile
spring:
  config:
    activate:
      on-profile: dev
  cloud:
    gateway:
      enabled: false
    compatibility-verifier:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:postgresql://localhost:5432/cicsgenapp
    username: genapp
    password: genapp123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      connection-test-query: "SELECT 1"
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# Development Gateway Configuration
gateway:
  legacy-endpoint: http://localhost:8081
  service-endpoint: http://localhost:8080
  timeout: 5000

# Development CORS Configuration (lenient for testing)
cors:
  allowed-origins: http://localhost:3000,http://localhost:3001,http://localhost:8080
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: Content-Type,Authorization,X-Trace-Id,X-Requested-With
  exposed-headers: X-Trace-Id
  max-age: 3600
  allow-credentials: true

# Development Resilience4j Configuration (lenient for faster feedback)
resilience4j:
  circuitbreaker:
    instances:
      legacy-cobol-system:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 2
        permittedNumberOfCallsInHalfOpenState: 1
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10000
        failureRateThreshold: 40
        slowCallRateThreshold: 40
        slowCallDurationThreshold: 3000

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.cloud.gateway: DEBUG
    com.example.cicsgenapp.gateway: DEBUG

---

# Test profile - uses TestContainers PostgreSQL for integration testing
spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://localhost:5432/cicsgenapp_test
    driver-class-name: org.postgresql.Driver
    username: test_user
    password: test_password
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    enabled: false

server:
  port: 8080

# Test Gateway Configuration (mock legacy service with TestContainers)
gateway:
  legacy-endpoint: http://test-legacy-service:8081
  service-endpoint: http://localhost:8080
  timeout: 5000

# Test CORS Configuration (allow all for integration testing)
cors:
  allowed-origins: "*"
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: Content-Type,Authorization,X-Trace-Id,X-Requested-With
  exposed-headers: X-Trace-Id
  max-age: 3600
  allow-credentials: true

# Test Resilience4j Configuration (disabled or very lenient for testing)
resilience4j:
  circuitbreaker:
    instances:
      legacy-cobol-system:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 1
        permittedNumberOfCallsInHalfOpenState: 1
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 1000
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 5000

---

# Production profile
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: create-drop
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-prod.example.com}:${DB_PORT:5432}/${DB_NAME:genapp_prod}
    username: ${DB_USER:genapp}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      connection-test-query: "SELECT 1"
      idle-timeout: 600000
      max-lifetime: 1800000

server:
  port: 8080
  compression:
    enabled: true
    min-response-size: 1024

# Production Gateway Configuration (strict, secure)
gateway:
  legacy-endpoint: https://legacy-system.corporate.com
  service-endpoint: http://localhost:8080
  timeout: 5000

# Production CORS Configuration (strict origin matching)
cors:
  allowed-origins: https://cicsgenapp.example.com
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: Content-Type,Authorization,X-Trace-Id,X-Requested-With
  exposed-headers: X-Trace-Id
  max-age: 3600
  allow-credentials: true

# Production Resilience4j Configuration (strict thresholds)
resilience4j:
  circuitbreaker:
    instances:
      legacy-cobol-system:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 1
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30000
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 5000

logging:
  level:
    root: WARN
    com.example.cicsgenapp: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
