spring:
  application:
    name: genapp-codex
  datasource:
    url: jdbc:postgresql://localhost:5432/genapp
    username: genapp
    password: genapp
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: 8080
